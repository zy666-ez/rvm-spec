<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVM-Spec Live Preview</title>
<style>
  :root {
    --bg: #f0f2f5;
    --sidebar-bg: #ffffff;
    --card-bg: #fafafa;
    --accent: #4a90d9;
    --accent-hover: #357abd;
    --text: #333333;
    --text-dim: #888888;
    --text-light: #666666;
    --border: #e0e0e0;
    --hover: #e8f0fe;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ─────────────────────────── */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 16px;
    gap: 10px;
    box-shadow: var(--shadow);
    z-index: 10;
  }
  .sidebar h2 {
    font-size: 1.05em;
    color: var(--accent);
    margin-bottom: 2px;
    font-weight: 600;
  }
  .sidebar .hint {
    font-size: 0.75em;
    color: var(--text-dim);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .bg-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .bg-card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .bg-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(74,144,217,0.2);
    transform: translateY(-1px);
  }
  .bg-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
  }
  .bg-card img {
    width: 100%;
    height: 80px;
    object-fit: cover;
    display: block;
    background: #e8e8e8;
  }
  .bg-card .label {
    font-size: 0.7em;
    padding: 5px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    color: var(--text-light);
    background: #fff;
  }

  /* ── Main ─────────────────────────────── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #e8eaed;
  }
  .video-wrap {
    flex: 1;
    position: relative;
    background: #d0d3d8;
    overflow: hidden;
    min-height: 0;
  }
  .video-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* zoom indicator */
  .zoom-indicator {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75em;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .zoom-indicator.show { opacity: 1; }

  /* ── Status bar ───────────────────────── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: #fff;
    font-size: 0.8em;
    color: var(--text-light);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .status-bar .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }
  .dot.live { background: #4caf50; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── Controls ─────────────────────────── */
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #fff;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .controls button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    font-size: 0.8em;
    transition: all 0.2s;
  }
  .controls button:hover {
    background: var(--hover);
    border-color: var(--accent);
    color: var(--accent);
  }
  .controls button:active {
    background: var(--accent);
    color: #fff;
  }
  .controls .kbd {
    font-size: 0.65em;
    color: var(--text-dim);
    background: #f0f0f0;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
    border: 1px solid #e0e0e0;
  }
  .controls .sep { width:1px; height:20px; background:var(--border); margin:0 4px; }

  /* ── Metrics toast ────────────────────── */
  .metrics-toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #fff;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 0.85em;
    display: none;
    z-index: 100;
    max-width: 340px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  .metrics-toast.show { display: block; }
  .metrics-toast h4 { color: var(--accent); margin-bottom: 6px; font-size: 0.95em; }
  .metrics-toast .val { color: var(--accent); font-weight: bold; }
</style>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────── -->
<div class="sidebar">
  <h2>背景素材</h2>
  <div class="hint">点击缩略图切换背景 | W/S 键也可切换</div>
  <div class="bg-grid" id="bgGrid">
    {% for bg in backgrounds %}
    <div class="bg-card" data-filename="{{ bg }}" onclick="selectBg('{{ bg }}')">
      <img src="/api/thumb/{{ bg }}" alt="{{ bg }}" onerror="this.style.background='#eee';this.style.minHeight='80px'">
      <div class="label">{{ bg }}</div>
    </div>
    {% endfor %}
    {% if not backgrounds %}
    <div style="grid-column:span 2;color:var(--text-dim);font-size:0.8em;text-align:center;padding:20px;">
      background 文件夹为空<br>请放入图片或视频
    </div>
    {% endif %}
  </div>
</div>

<!-- ── Main ─────────────────────────────────── -->
<div class="main">
  <div class="video-wrap">
    <img id="stream" src="/video_feed" alt="Live stream"
         onload="document.getElementById('streamPlaceholder').style.display='none'"
         onerror="document.getElementById('streamPlaceholder').innerHTML='<p>视频流连接失败</p><p style=font-size:0.8em;color:#999>检查终端是否有错误信息</p>'">
    <div id="streamPlaceholder" style="position:absolute;color:#999;text-align:center;width:100%;top:50%;transform:translateY(-50%);">
      <p>正在连接摄像头...</p>
    </div>
    <div class="zoom-indicator" id="zoomIndicator">100%</div>
  </div>

  <div class="status-bar">
    <span><span class="dot live"></span> LIVE</span>
    <span id="modeLabel">Mode: Real</span>
    <span id="blurLabel">Blur: OFF</span>
    <span id="bgLabel">BG: None</span>
    <span id="recordLabel" style="color:#f5a623;display:none;"></span>
  </div>

  <div class="controls">
    <button onclick="action('mode','real')">真实背景 <span class="kbd">N</span></button>
    <button onclick="action('mode','virtual')">虚拟背景</button>
    <span class="sep"></span>
    <button onclick="action('blur')">虚化切换 <span class="kbd">V</span></button>
    <span class="sep"></span>
    <button onclick="bgPrev()">◀ 上一个 <span class="kbd">S</span></button>
    <button onclick="bgNext()">下一个 ▶ <span class="kbd">W</span></button>
    <span class="sep"></span>
    <span class="sep"></span>
    <button onclick="zoomOut()" title="缩小">🔍−</button>
    <button id="btnZoomReset" onclick="zoomReset()" style="min-width:52px;text-align:center;">100%</button>
    <button onclick="zoomIn()" title="放大">🔍+</button>
    <span class="sep"></span>
    <button onclick="action('record')" id="btnRecord" style="border-color:#f5a623;color:#f5a623;">记录指标 <span class="kbd">R</span></button>
  </div>
</div>

<!-- ── Metrics toast ────────────────────────── -->
<div class="metrics-toast" id="metricsToast">
  <h4>指标统计完成</h4>
  <div id="metricsContent"></div>
</div>

<script>
// ── State ─────────────────────────────────────
let bgIndex = -1;
let bgList = {{ backgrounds | tojson }};
let currentBgName = null;
let currentMode = 'real';
let blurEnabled = false;
let isRecording = false;
let lastMetricsFrames = null;  // prevent repeated toast

// ── Zoom state ─────────────────────────────────
let zoomLevel = 1.0;
const ZOOM_MIN = 0.5, ZOOM_MAX = 3.0, ZOOM_STEP = 0.1;

// ── Select background ─────────────────────────
async function selectBg(filename) {
  const res = await fetch(`/api/background/${encodeURIComponent(filename)}`, { method: 'POST' });
  const data = await res.json();
  if (data.ok) {
    currentBgName = filename;
    currentMode = 'virtual';
    updateUI();
  }
}

// ── Cycle backgrounds (W/S) ───────────────────
async function bgNext() {
  if (bgList.length === 0) return;
  bgIndex = (bgIndex + 1) % bgList.length;
  await selectBg(bgList[bgIndex]);
}
async function bgPrev() {
  if (bgList.length === 0) return;
  bgIndex = (bgIndex - 1 + bgList.length) % bgList.length;
  await selectBg(bgList[bgIndex]);
}

// ── Generic actions ───────────────────────────
async function action(type, arg) {
  if (type === 'mode') {
    if (arg === 'virtual' && currentBgName && currentMode === 'real') {
      // Just switch mode, background already loaded
    } else if (arg === 'virtual' && !currentBgName && bgList.length > 0) {
      // No bg selected yet, load first one
      bgIndex = 0;
      await selectBg(bgList[0]);
      return;
    }
    await fetch('/api/mode', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ mode: arg })
    });
    currentMode = arg;
    if (arg === 'real') currentBgName = null;
  }
  if (type === 'blur') {
    const res = await fetch('/api/blur', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
    const data = await res.json();
    blurEnabled = data.blur_enabled;
  }
  if (type === 'record') {
    await fetch('/api/record', { method: 'POST' });
    isRecording = true;
    document.getElementById('recordLabel').style.display = 'inline';
    document.getElementById('recordLabel').textContent = 'Recording...';
  }
  updateUI();
}

// ── UI update ─────────────────────────────────
function updateUI() {
  // Mode
  document.getElementById('modeLabel').textContent = 'Mode: ' + (currentMode === 'virtual' ? 'Virtual' : 'Real');
  // Blur
  document.getElementById('blurLabel').textContent = 'Blur: ' + (blurEnabled ? 'ON' : 'OFF');
  // BG name
  document.getElementById('bgLabel').textContent = 'BG: ' + (currentBgName || 'None');

  // Active card
  document.querySelectorAll('.bg-card').forEach(card => {
    card.classList.toggle('active', card.dataset.filename === currentBgName);
  });
}

// ── Keyboard shortcuts ────────────────────────
document.addEventListener('keydown', e => {
  // Ignore if typing in an input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.key.toLowerCase()) {
    case 'n': action('mode', 'real'); break;
    case 'v': action('blur'); break;
    case 'w': bgNext(); break;
    case 's': bgPrev(); break;
    case 'r':
      if (!isRecording) action('record');
      break;
    case '+': case '=': zoomIn(); break;
    case '-': zoomOut(); break;
    case '0': zoomReset(); break;
  }
});

// ── Zoom functions（调用后端，人像缩放背景不动）───
async function setZoom(level) {
  zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, level));
  await fetch('/api/zoom', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ level: zoomLevel })
  });
  document.getElementById('btnZoomReset').textContent = Math.round(zoomLevel * 100) + '%';
  flashZoomIndicator();
}

async function zoomIn()  { await setZoom(zoomLevel + ZOOM_STEP); }
async function zoomOut() { await setZoom(zoomLevel - ZOOM_STEP); }
async function zoomReset() { await setZoom(1.0); }

function flashZoomIndicator() {
  const el = document.getElementById('zoomIndicator');
  el.textContent = Math.round(zoomLevel * 100) + '%';
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => el.classList.remove('show'), 1200);
}

// Mouse wheel zoom → backend
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.querySelector('.video-wrap');
  if (!wrap) return;
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.deltaY < 0) zoomIn();
    else zoomOut();
  }, { passive: false });
});

// ── Poll state & metrics ──────────────────────
setInterval(async () => {
  try {
    const res = await fetch('/api/state');
    const s = await res.json();

    currentMode = s.current_mode;
    blurEnabled = s.blur_enabled;
    currentBgName = s.current_bg_name;
    bgList = s.bg_list;
    if (s.zoom_level !== undefined) {
      zoomLevel = s.zoom_level;
      document.getElementById('btnZoomReset').textContent = Math.round(zoomLevel * 100) + '%';
    }

    // Recording status
    if (s.is_recording) {
      isRecording = true;
      document.getElementById('recordLabel').style.display = 'inline';
      document.getElementById('recordLabel').textContent = `Recording: ${s.record_count}/${s.record_max}`;
    } else if (isRecording && !s.is_recording) {
      isRecording = false;
      document.getElementById('recordLabel').style.display = 'none';
    }

    // Metrics result — only show once per completion
    if (s.metrics_result && s.metrics_result.frames !== lastMetricsFrames) {
      lastMetricsFrames = s.metrics_result.frames;
      const m = s.metrics_result;
      document.getElementById('metricsContent').innerHTML = `
        <p>帧数: <span class="val">${m.frames}</span></p>
        <p>时序边缘方差 (乱跳度): <span class="val">${m.mean_temp} ± ${m.std_temp}</span></p>
        <p>拉普拉斯方差 (锋利度): <span class="val">${m.mean_lap} ± ${m.std_lap}</span></p>
      `;
      const toast = document.getElementById('metricsToast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 8000);
      // Clear to avoid re-showing
      await fetch('/api/state'); // consumed, clear it server-side isn't needed; just UI guard
    }

    updateUI();
  } catch (e) { /* ignore */ }
}, 500);

// ── Initialize ────────────────────────────────
if (bgList.length > 0) {
  bgIndex = 0;
  selectBg(bgList[0]);
}
updateUI();
</script>
</body>
</html>
